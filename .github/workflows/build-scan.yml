name: Build & Scan Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # Job 1: Build hardened builder image, scan, then pass to next job
  build-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hardened builder image
        run: docker build -f Dockerfile.builder -t builder-hardened:latest .

      - name: Scan with HTML report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'builder-hardened:latest'
          format: 'template'
          template: '@$HOME/.local/bin/trivy-bin/contrib/html.tpl'
          output: 'trivy-builder.html'
          # severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-html-report
          path: trivy-builder.html

      # Save image as tar and upload as artifact
      - name: Save builder image to tar
        run: docker save builder-hardened:latest -o builder-image.tar

      - name: Upload builder image artifact
        uses: actions/upload-artifact@v4
        with:
          name: builder-image
          path: builder-image.tar

  # Job 2: Load builder image, build JAR, scan JAR image
  build-jar:
    needs: build-builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download builder image
        uses: actions/download-artifact@v4
        with:
          name: builder-image

      - name: Load builder image
        run: docker load -i builder-image.tar

      - name: Build JAR image using builder
        run: docker build -f Dockerfile.app -t app-jar:latest .

      - name: Scan with HTML report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'app-jar:latest'
          format: 'template'
          template: '@$HOME/.local/bin/trivy-bin/contrib/html.tpl'
          output: 'trivy-builder.html'
          # severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-html-report
          path: trivy-app.html